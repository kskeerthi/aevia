\n\n  <section>\n    <div class=\"wrap\">\n      <p class=\"eyebrow\">Four worlds, one app</p>\n      <h2>Everything your health touches, <em>together.</em></h2>\n      <p class=\"lead\">Each of these is usually its own company and its own login. Aevia brings them under one roof, so they can finally share what they know about you.</p>\n      <div class=\"pillars\">\n        <div class=\"pill-card\" data-route=\"v-dash\">\n          <div class=\"pic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z\"/><path d=\"M9 12l2 2 4-4\"/></svg></div>\n          <h3>Insurance</h3><p>See what is covered, what you owe, and where your claims are, in plain numbers.</p><div class=\"go\">Open &rarr;</div>\n        </div>\n        <div class=\"pill-card\" data-route=\"v-dash\">\n          <div class=\"pic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"8\" width=\"16\" height=\"12\" rx=\"2\"/><path d=\"M9 8V5a3 3 0 0 1 6 0v3M12 12v4M10 14h4\"/></svg></div>\n          <h3>Pharmacy</h3><p>Order and refill medicine in a tap, delivered to your door, priced before you buy.</p><div class=\"go\">Open &rarr;</div>\n        </div>\n        <div class=\"pill-card\" data-route=\"v-dash\">\n          <div class=\"pic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3v6l-5 8a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-8V3\"/><path d=\"M8 3h8M8 14h8\"/></svg></div>\n          <h3>Labs</h3><p>At-home blood testing that turns a wall of numbers into one clear picture and a plan.</p><div class=\"go\">Open &rarr;</div>\n        </div>\n        <div class=\"pill-card\" data-route=\"v-dash\">\n          <div class=\"pic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" strok s=\"on\" href=\"helm.html\">Helm</a><a href=\"bastion.html\">Bastion</a></div>\n  <div class=\"obj\" id=\"objEdit\"><span class=\"lab\">Objective</span><span class=\"val\"><span id=\"objVal\">Prepare the Q3 competitive brief</span> <svg class=\"pen\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/></svg></span></div>\n  <div class=\"top-right\">\n      <button class=\"kbtn\" id=\"cmdBtn2\" aria-label=\"Command palette\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4\"/></svg><span class=\"k\">&#8984;K</span></button>\n    <div class=\"seg\" id=\"auto\">\n      <button data-lv=\"supervised\">Supervised</button>\n      <button class=\"on\" data-lv=\"balanced\">Balanced</button>\n      <button data-lv=\"autonomous\">Autonomous</button>\n    </div>\n    <button class=\"btn ghost hidden\" id=\"pauseBtn\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/></svg> Pause</button>\n    <button class=\"btn run\" id=\"runBtn\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg> Start run</button>\n  </div>\n</div>\n\n<div class=\"grid\">\n  <!-- LEFT: plan + stats -->\n  <div class=\"col\">\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"v\" id=\"mElapsed\">0:00</div><div class=\"l\">Elapsed</div></div>\n      <div class=\"stat\"><div class=\"v\" id=\"mActive\">0</div><div class=\"l\">Agents active</div></div>\n      <div class=\"stat\"><div class=\"v\" id=\"mApprovals\">0</div><div class=\"l\">Approvals</div></div>\n      <div class=\"stat\"><div class=\"v\" id=\"mCost\">$0.00</div><div class=\"l\">Spend</div></div>\n    </div>\n    <div class=\"col-h\"><h2>Plan</h2><span class=\"c\" id=\"planC\">0 / 5</span></div>\n    <div class=\"plan\" id=\"plan\">\n      <div class=\"pstep pending\" id=\"p0\"><span class=\"node\"></span><div class=\"t\">Gather sources</div><div class=\"a\">researcher</div></div>\n      <div class=\"pstep pending\" id=\"p1\"><span class=\"node\"></span><div class=\"t\">Pull pricing data</div><div class=\"a\">analyst</div></div>\n      <div class=\"pstep pending\" id=\"p2\"><span class=\"node\"></span><div class=\"t\">Analyze positioning</div><div class=\"a\">analyst</div></div>\n      <div class=\"pstep pending\" id=\"p3\"><span class=\"node\"></span><div class=\"t\">Draft the brief</div><div class=\"a\">writer</div></div>\n      <div class=\"pstep pending\" id=\"p4\"><span class=\"node\"></span><div class=\"t\">Send to the team</div><div class=\"a\">ops</div></div>\n    </div>\n    <div class=\"anote\">\n      <b>You are at the helm.</b>\n      <p id=\"autoDesc\">In Balanced mode, agents run on their own but pause for your approval before anything that spends money or leaves the building.</p>\n    </div>\n  </div>\n\n  <!-- CENTER: gate + agents -->\n  <div class=\"col\">\n    <div id=\"modeBanner\" class=\"mode-banner\"></div>\n    <div id=\"gateWrap\"></div>\n    <div class=\"board-h\"><h2>Agents <span id=\"agCount\" style=\"color:var(--text-3);font-weight:400\">4</span></h2><button class=\"btn ghost add\" id=\"addAgentBtn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 5v14M5 12h14\"/></svg> Add agent</button></div>\n    <div class=\"agents\">\n      <div class=\"agent\" id=\"a-research\" data-s=\"idle\"><div class=\"glow\"></div><div class=\"ah\"><div class=\"av\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4\"/></svg></div><div><div class=\"an\">Researcher</div><div class=\"ar\">Reads and gathers sources</div></div><span class=\"st\"><span class=\"d\"></span>Idle</span></div><div class=\"doing\" data-doing>Waiting to start</div><div class=\"pbar\"><i data-prog></i></div></div>\n      <div class=\"agent\" id=\"a-analyst\" data-s=\"idle\"><div class=\"glow\"></div><div class=\"ah\"><div class=\"av\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"/></svg></div><div><div class=\"an\">Analyst</div><div class=\"ar\">Finds patterns in data</div></div><span class=\"st\"><span class=\"d\"></span>Idle</span></div><div class=\"doing\" data-doing>Waiting to start</div><div class=\"pbar\"><i data-prog></i></div></div>\n      <div class=\"agent\" id=\"a-writer\" data-s=\"idle\"><div class=\"glow\"></div><div class=\"ah\"><div class=\"av\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/></svg></div><div><div class=\"an\">Writer</div><div class=\"ar\">Writes the brief</div></div><span class=\"st\"><span class=\"d\"></span>Idle</span></div><div class=\"doing\" data-doing>Waiting to start</div><div class=\"pbar\"><i data-prog></i></div></div>\n      <div class=\"agent\" id=\"a-ops\" data-s=\"idle\"><div class=\"glow\"></div><div class=\"ah\"><div class=\"av\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4z\"/></svg></div><div><div class=\"an\">Ops</div><div class=\"ar\">Sends and ships work</div></div><span class=\"st\"><span class=\"d\"></span>Idle</span></div><div class=\"doing\" data-doing>Waiting to start</div><div class=\"pbar\"><i data-prog></i></div></div>\n    </div>\n  </div>\n\n  <!-- RIGHT: activity -->\n  <div class=\"col\">\n    <div class=\"col-h\"><h2>Activity</h2><span class=\"c\" id=\"lnCount\">live</span></div>\n    <div class=\"stream\" id=\"stream\"><div class=\"empty-s\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4 6h16M4 12h10M4 18h7\"/></svg>Press Start run to watch the agents work, and see everything they do, in order.</div></div>\n  </div>\n</div>\n\n<div class=\"ov2\" id=\"addOv\"><div class=\"m2\">\n  <button class=\"dx2\" id=\"addX\" aria-label=\"Close\">&times;</button>\n  <div class=\"eb2\">New agent</div>\n  <h3>Add an agent to the team</h3>\n  <p class=\"hx\">Pick a role, give it a name, and drop it in. It joins on standby, ready for a task.</p>\n  <div class=\"roles\" id=\"roleGrid\"></div>\n  <input id=\"agName\" placeholder=\"Name (optional)\">\n  <button class=\"sbtn2\" id=\"addConfirm\">Add to team</button>\n</div></div>\n\n<div class=\"objov\" id=\"objov\"><div class=\"objbox\">\n  <div class=\"eb\">Give Helm an objective</div>\n  <h3>What should the team work on?</h3>\n  <textarea id=\"objIn\" placeholder=\"e.g. Prepare the Q3 competitive brief\"></textarea>\n  <div class=\"obj-ex\" id=\"objEx\"></div>\n  <button class=\"go\" id=\"objGo\">Set objective</button>\n  <div class=\"note\">This demo runs the same five-phase plan whatever you type. Your objective shows in the header and is logged when the run starts.</div>\n</div></div>\n\n<div class=\"ov3\" id=\"instructOv\"><div class=\"m3\">\n  <button class=\"dx3\" id=\"instrX\" aria-label=\"Close\">&times;</button>\n  <div class=\"who3\" id=\"instrWho\"></div>\n  <textarea id=\"instrIn\" placeholder=\"Tell this agent what to do or change...\"></textarea>\n  <div class=\"exs\" id=\"instrEx\"></div>\n  <button class=\"send3\" id=\"instrSend\">Send instruction</button>\n</div></div>\n\n<div class=\"cmdov\" id=\"cmdov\"><div class=\"cmdbox\">\n  <div class=\"cin\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4\"/></svg><input id=\"cmdInput\" placeholder=\"Type a command, or search actions...\"></div>\n  <div class=\"cmdlist\" id=\"cmdListH\"></div>\n</div></div>\n<div class=\"toastwrap\" id=\"toastwrap\"></div>\n\n<div class=\"drov\" id=\"drov\"><div class=\"draw\" id=\"draw\"></div></div>\n\n<div class=\"footnote\">Helm is a concept by Sai Keerthi Koppolu, a design exploration of how a person stays in control of many AI agents. Nothing here is real.</div>\n\n<script>\n(function(){\n  function $(s,r){return (r||document).querySelector(s);}\n  var S={running:false,paused:false,gate:null,level:'balanced',i:0,t0:0,cost:0,approvals:0,active:0,timer:null};\n  var AG={research:'Researcher',analyst:'Analyst',writer:'Writer',ops:'Ops'};\n\n  var TL=[\n    {k:'log',a:'system',m:'Run started. Decomposing objective into a plan.',hi:1,d:600},\n    {k:'plan',i:0,s:'active'},{k:'astat',a:'research',s:'running',doing:'Searching the web'},\n    {k:'log',a:'research',m:'Searching 42 sources across the web',d:700},\n    {k:'prog',a:'research',p:35,cost:.4,doing:'Ranking 42 results by relevance'},\n    {k:'log',a:'research',m:'Found 18 relevant pages, 3 need external access',d:800},\n    {k:'gate',id:'g1',risk:'low',a:'research',title:'Read 3 external sites?',do:'Open forrester.com, a16z.com and a competitor pricing page',why:'These are outside my allowed domains. I only need to read them, not submit anything.'},\n    {k:'prog',a:'research',p:75,cost:.3,doing:'Summarising key claims'},\n    {k:'log',a:'research',m:'Summarised 18 sources into 9 findings',d:700},\n    {k:'astat',a:'research',s:'done',doing:'Done. 9 findings ready.'},{k:'prog',a:'research',p:100},{k:'plan',i:0,s:'done'},\n\n    {k:'plan',i:1,s:'active'},{k:'astat',a:'analyst',s:'running',doing:'Locating pricing data'},\n    {k:'log',a:'analyst',m:'Public pricing data is incomplete for 2 competitors',d:800},\n    {k:'gate',id:'g2',risk:'money',a:'analyst',title:'Purchase the pricing dataset?',do:'Buy \"Market Pricing 2026\" for $240',why:'It fills the two gaps and is the source our last brief used. Without it, two numbers will be estimates.'},\n    {k:'prog',a:'analyst',p:50,cost:0,doing:'Loading purchased dataset'},\n    {k:'log',a:'analyst',m:'Dataset loaded, pricing complete for all 6 competitors',d:700},{k:'plan',i:1,s:'done'},\n\n    {k:'plan',i:2,s:'active'},{k:'astat',a:'analyst',s:'running',doing:'Modelling positioning'},\n    {k:'log',a:'analyst',m:'We are priced 12% above the median, with the strongest service tier',d:900},\n    {k:'prog',a:'analyst',p:100,cost:.6,doing:'Done. 3 takeaways identified.'},\n    {k:'astat',a:'analyst',s:'done',doing:'Done. 3 takeaways ready.'},{k:'plan',i:2,s:'done'},\n\n    {k:'plan',i:3,s:'active'},{k:'astat',a:'writer',s:'running',doing:'Drafting the brief'},\n    {k:'log',a:'writer',m:'Drafting: summary, positioning, three recommendations',d:800},\n    {k:'prog',a:'writer',p:60,cost:.5,doing:'Writing the recommendations'},\n    {k:'log',a:'writer',m:'Draft ready, 2 pages, plain language, sources linked',d:800},\n    {k:'prog',a:'writer',p:100},{k:'astat',a:'writer',s:'done',doing:'Done. Brief drafted.'},{k:'plan',i:3,s:'done'},\n\n    {k:'plan',i:4,s:'active'},{k:'astat',a:'ops',s:'running',doing:'Preparing to send'},\n    {k:'gate',id:'g3',risk:'send',a:'ops',title:'Email the brief to the team?',do:'Send to 6 recipients on the strategy list',why:'This leaves the building and cannot be unsent. I have attached the 2-page brief and a one-line summary.'},\n    {k:'log',a:'ops',m:'Sent to 6 recipients, logged in the thread',d:700},\n    {k:'prog',a:'ops',p:100},{k:'astat',a:'ops',s:'done',doing:'Done. Brief delivered.'},{k:'plan',i:4,s:'done'},\n    {k:'done'}\n  ];\n\n  var descs={\n    supervised:'In Supervised mode, agents pause for your approval before every action that touches the outside world, even low-risk reads.',\n    balanced:'In Balanced mode, agents run on their own but pause for your approval before anything that spends money or leaves the building.',\n    autonomous:'In Autonomous mode, agents handle routine and paid steps on their own, and only stop for the irreversible ones, like sending.'\n  };\n  function autoApprove(risk){\n    if(S.level==='supervised') return false;\n    if(S.level==='balanced') return risk==='low';\n    if(S.level==='autonomous') return risk!=='send';\n    return false;\n  }\n\n  document.querySelectorAll('#auto button').forEach(function(b){ b.addEventListener('click',function(){\n    document.querySelectorAll('#auto button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');\n    S.level=b.getAttribute('data-lv'); $('#autoDesc').textContent=descs[S.level]; updateMode(S.level); toast((MODES[S.level]||{t:S.level}).t+' mode');\n  }); });\n\n  function pad(n){return (n<10?'0':'')+n;}\n  function now(){ if(!S.t0) return '0:00'; var s=Math.floor((Date.now()-S.t0)/1000); return pad(Math.floor(s/60))+':'+pad(s%60); }\n  function log(a,m,hi){\n    var s=$('#stream'); var e=s.querySelector('.empty-s'); if(e)e.remove();\n    var d=document.createElement('div'); d.className='ln'+(hi?' hi':'');\n    d.innerHTML='<span class=\"ts\">'+now()+'</span><span class=\"ag '+a+'\">'+(a==='system'?'sys':a==='you'?'you':AG[a]||a)+'</span><span class=\"tx\">'+m+'</span>';\n    s.appendChild(d); s.scrollTop=s.scrollHeight;\n  }\n  function setAgent(a,s,doing){\n    var el=$('#a-'+a); el.setAttribute('data-s',s); el.classList.remove('running','done','blocked'); if(s!=='idle')el.classList.add(s);\n    var pill=$('.st',el); var names={idle:'Idle',running:'Running',done:'Done',blocked:'Blocked'};\n    pill.innerHTML='<span class=\"d\"></span>'+names[s];\n    if(doing) $('[data-doing]',el).innerHTML='<span class=\"cur\">'+doing+'</span>';\n    S.active=document.querySelectorAll('.agent[data-s=running]').length; $('#mActive').textContent=S.active;\n  }\n  function setProg(a,p){ $('[data-prog]',$('#a-'+a)).style.width=p+'%'; }\n  function setPlan(i,s){ var el=$('#p'+i); el.className='pstep '+s; var done=document.querySelectorAll('.pstep.done').length; $('#planC').textContent=done+' / 5'; }\n  function addCost(c){ if(!c)return; S.cost+=c; $('#mCost').textContent='$'+S.cost.toFixed(2); }\n\n  function apply(e){\n    if(e.k==='log') log(e.a,e.m,e.hi);\n    else if(e.k==='astat') setAgent(e.a,e.s,e.doing);\n    else if(e.k==='prog'){ setProg(e.a,e.p); if(e.cost)addCost(e.cost); if(e.doing)$('[data-doing]',$('#a-'+e.a)).innerHTML='<span class=\"cur\">'+e.doing+'</span>'; }\n    else if(e.k==='plan') setPlan(e.i,e.s);\n  }\n\n  function tick(){\n    if(!S.running||S.paused||S.gate) return;\n    if(S.i>=TL.length){ finish(); return; }\n    var e=TL[S.i++];\n    if(e.k==='done'){ finish(); return; }\n    if(e.k==='gate'){ gate(e); return; }\n    apply(e);\n    setTimeout(tick, e.d||520);\n  }\n\n  function gate(e){\n    setAgent(e.a,'blocked','Waiting for your approval');\n    if(autoApprove(e.risk)){ (S.decisions=S.decisions||{})[e.id]='auto'; log('system','Auto-approved ('+S.level+'): '+e.do.toLowerCase(),0); setTimeout(function(){ setAgent(e.a,'running'); tick(); }, 700); return; }\n    S.gate=e;\n    var risks={low:'Low risk',money:'Spends money',send:'Irreversible'};\n    $('#gateWrap').innerHTML='<div class=\"gate\"><div class=\"gh\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 3l9 16H3z\"/><path d=\"M12 10v4M12 17h.01\"/></svg> Needs your approval <span class=\"rk\">'+risks[e.risk]+'</span></div><h3>'+e.title+'</h3><div class=\"who\">'+AG[e.a]+' wants to: '+e.do+'</div><div class=\"why\"><b>Why:</b> '+e.why+'</div><div class=\"ga\"><button class=\"btn run\" id=\"gAppr\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z\"/></svg> Approve</button><button class=\"btn ghost\" id=\"gRej\">Reject</button></div></div>';\n    $('#gAppr').addEventListener('click',function(){ resolve(true); });\n    $('#gRej').addEventListener('click',function(){ resolve(false); });\n  }\n  function resolve(ok){\n    var e=S.gate; S.gate=null; $('#gateWrap').innerHTML=''; (S.decisions=S.decisions||{})[e.id]=ok?'approved':'rejected'; toast(ok?'Approved':'Rejected', ok);\n    S.approvals++; $('#mApprovals').textContent=S.approvals;\n    if(ok){ log('you','Approved: '+e.do.toLowerCase(),1); if(e.risk==='money')addCost(240); setAgent(e.a,'running'); }\n    else {\n      log('you','Rejected: '+e.do.toLowerCase(),1);\n      if(e.id==='g1'){ log('research','Skipped external sites, using cached summaries',0); }\n      if(e.id==='g2'){ log('analyst','Falling back to public pricing, 2 figures are estimates',0); }\n      if(e.id==='g3'){ log('ops','Saved the brief as a draft instead',0); }\n      setAgent(e.a,'running');\n    }\n    setTimeout(tick,500);\n  }\n\n  function briefData(){ var d=S.decisions||{}; var est=(d.g2==='rejected');\n    return {\n      summary:'You hold a premium position, priced about 12% above the median of six competitors, with the strongest service tier.'+(est?' Two competitor prices are estimates, so treat the exact figure as directional.':''),\n      positioning:'A higher price, clearly justified by service depth. The main risk is mid-market buyers who screen on price alone.',\n      recs:['Lead every pitch with the service guarantee, not the price.','Add a lighter tier to catch price-sensitive buyers without discounting the core.','Publish a value calculator so buyers see the premium as worth it.']\n    };\n  }\n  var MAILIC='<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg>';\n  var DRAFTIC='<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/></svg>';\n  function renderDelivery(){ var sent=S.sent;\n    return '<div class=\"delivery\"><div class=\"di\">'+(sent?MAILIC:DRAFTIC)+'</div><div class=\"dt\"><b>'+(sent?'Emailed to 6 recipients':'Saved as a draft')+'</b><span style=\"color:var(--text-3)\">'+(sent?'Strategy list, just now':'Not sent yet, waiting for you')+'</span></div></div>';\n  }\n  function finish(){\n    S.running=false; if(S.timer){clearInterval(S.timer);S.timer=null;}\n    var d=S.decisions||{}; S.sent=(d.g3!=='rejected'); toast('Run complete');\n    var b=briefData();\n    log('system','Run complete. Brief '+(S.sent?'prepared and sent to the team.':'prepared and saved as a draft.'),1);\n    var stats=document.querySelectorAll('.pstep.done').length+' / 5 phases &middot; '+S.approvals+' approvals &middot; $'+S.cost.toFixed(2)+' &middot; '+now();\n    $('#gateWrap').innerHTML='<div class=\"done-card\">'\n      +'<div class=\"dh\"><span class=\"ok\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z\"/></svg> Run complete</span><span class=\"sum\">'+stats+'</span></div>'\n      +'<h3>Q3 Competitive Brief</h3>'\n      +'<div class=\"brief-mini\"><b>Summary.</b> '+b.summary+'<ol><li>'+b.recs.join('</li><li>')+'</li></ol></div>'\n      +'<div id=\"deliveryBox\">'+renderDelivery()+'</div>'\n      +'<div class=\"done-actions\"><button class=\"btn ghost\" id=\"viewBrief\">View full brief</button><button class=\"btn ghost\" id=\"openMail\">'+(S.sent?'Open the email':'Open the draft')+'</button></div>'\n      +'</div>';\n    $('#viewBrief').addEventListener('click',function(){ openDoc('brief'); });\n    $('#openMail').addEventListener('click',function(){ openDoc('mail'); });\n    var rb=$('#runBtn'); rb.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm-1 15-4-4 1.4-1.4L11 14.2l5.6-5.6L18 10z\"/></svg> Run again'; rb.disabled=false; $('#pauseBtn').classList.add('hidden');\n    $('#gateWrap').scrollIntoView({behavior:'smooth',block:'nearest'});\n  }\n  function openDoc(kind){\n    var b=briefData();\n    if(kind==='brief'){\n      $('#draw').innerHTML='<button class=\"dx\" id=\"drx\">&times;</button><div class=\"eb\">Deliverable</div><h1 class=\"doc-h1\">Q3 Competitive Brief</h1><div class=\"doc-meta\">2 pages &middot; generated by Helm &middot; every claim sourced</div>'\n        +'<div class=\"doc-sec\"><h4>Summary</h4><p>'+b.summary+'</p></div>'\n        +'<div class=\"doc-sec\"><h4>Positioning</h4><p>'+b.positioning+'</p></div>'\n        +'<div class=\"doc-sec\"><h4>Recommendations</h4><ol style=\"color:var(--text-2);padding-left:18px;line-height:1.75;margin:0\"><li>'+b.recs.join('</li><li>')+'</li></ol></div>'\n        +'<div class=\"steernote\" style=\"background:var(--panel-2);border-color:var(--line);color:var(--text-2)\">Every claim links to the finding behind it. Open any phase to trace a number back to its source.</div>';\n    } else {\n      var status = S.sent\n        ? '<div style=\"margin-top:16px;display:inline-flex;gap:7px;align-items:center;color:var(--done);font-weight:600;font-size:.82rem\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z\"/></svg> Sent just now to 6 recipients</div>'\n        : '<div style=\"margin-top:16px\"><button class=\"btn run\" id=\"sendNow\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4z\"/></svg> Send it now</button></div>';\n      $('#draw').innerHTML='<button class=\"dx\" id=\"drx\">&times;</button><div class=\"eb\">'+(S.sent?'Sent email':'Draft email')+'</div><h3 style=\"margin:8px 0 14px;font-size:1.4rem\">Q3 competitive brief</h3>'\n        +'<div class=\"mail\"><div class=\"row\"><span class=\"k\">To</span><span>Strategy list, 6 recipients</span></div><div class=\"row\"><span class=\"k\">From</span><span>you@company.com</span></div><div class=\"row\"><span class=\"k\">Subject</span><span>Q3 competitive brief</span></div>'\n        +'<div class=\"body\">Hi team,<br><br>Helm pulled together our Q3 compet viewer',ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z\"/><path d=\"M9 12l2 2 4-4\"/></svg>'},\n    factcheck:{n:'Fact-checker',ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4M8.5 11l2 2 3.5-3.5\"/></svg>'},\n    research2:{n:'Researcher',ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4\"/></svg>'},\n    strategist:{n:'Strategist',ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1.6\"/></svg>'},\n    designer:{n:'Designer',ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/></svg>'},\n    custom:{n:'Specialist',ic:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M12 3v18M3 12h18\"/></svg>'}\n  };\n  var selRole='reviewer', agN=0;\n  var TASK={\n    reviewer:['Reading the brief end to end','The brief holds together. Flagged one claim to double-check.'],\n    factcheck:['Cross-checking the key numbers','All three figures check out against their sources.'],\n    research2:['Pulling additional sources','Added 2 findings and 4 new sources.'],\n    strategist:['Stress-testing the recommendations','They hold. Sharpened the third one.'],\n    designer:['Laying the brief out cleanly','Formatted and ready to present.'],\n    custom:['Working through the task','Task complete.']\n  };\n  function renderRoles(){ var g=$(' urn 'Team $32/mo &middot; Business $59/mo &middot; Enterprise: contact sales';\n    if(n.indexOf('service tier')>-1) return 'You: 24/7 support + dedicated CSM. Median peer: business hours only.';\n    if(n.indexOf('finding')>-1) return '9 findings, each linked to at least two independent sources.';\n    if(n.indexOf('positioning')>-1) return 'Median $45.5 &middot; You $52 (about 12% above) &middot; Top service tier.';\n    if(n.indexOf('recipients')>-1||n.indexOf('distribution')>-1||n.indexOf('list')>-1) return 'maya@, lead@, ops@, pm@, sales@, cs@ &mdash; the \"Strategy\" list (6).';\n    if(n.indexOf('estimate')>-1) return 'Two competitor prices estimated from public signals; treat as directional.';\n    if(n.indexOf('draft')>-1) return 'Draft \"Q3 competitive brief\" saved to your outbox, not sent.';\n    return 'Sample excerpt from this source.';\n  }\n\n  function logChips(a,m,chips){\n    var st=$('#stream'); var d=document.createElement('div'); d.className='ln';\n    d.innerHTML='<span class=\"ts\">'+now()+'</span><span class=\"ag '+a+'\">'+(a==='you'?'you':AG[a]||a)+'</span><span class=\"tx\">'+m+'<span class=\"chips\"></span></span>';\n    var cw=d.querySelector('.chips');\n    chips.forEach(function(c){ var b=document.createElement('button'); b.className='chip'; b.textContent=c.label;\n      b.addEventListener('click',function(){ if(cw.getAttribute('data-used'))return; cw.setAttribute('data-used','1'); cw.querySelectorAll('.chip').forEach(function(x){x.disabled=true;}); c.fn(); });\n      cw.appendChild(b); });\n    st.appendChild(d); st.scrollTop=st.scrollHeight;\n  }\n\n  function openPhase(i){\n    var st=$('#p'+i); var e=JSON.parse(JSON.stringify(EVID[i])); var d=S.decisions||{}; var steer=(S.steers||{})[i];\n    if(st.classList.contains('pending')){\n      $('#draw').innerHTML='<button class=\"dx\" id=\"drx\">&times;</button><div class=\"eb\">Phase '+(i+1)+'</div><h3>'+e.ti+'</h3><p class=\"dwhat\">This phase has not run yet. Press Start run, and its ght:600;font-size:1.05rem;}\n  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}\n  .btn{border:none;border-radius:100px;padding:10px 20px;font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:8px;}\n  .btn.go{background:var(--cyan);color:#04121a;box-shadow:0 0 20px rgba(34,211,238,.35);}\n  .btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--text);}\n  .btn svg{width:15px;height:15px;}\n\n  .grid{position:relative;z-index:1;display:grid;grid-template-columns:300px 1fr 340px;gap:1px;background:var(--line);height:calc(100vh - 60px);}\n  @media(max-width:1100px){.grid{grid-template-columns:1fr;height:auto;background:transparent;gap:14px;padding:14px;}}\n  .col{background:var(--bg);overflow-y:auto;padding:16px;padding-bottom:36px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}\n  .col::-webkit-scrollbar{width:8px;} .col::-webkit-scrollbar-thumb{background:var(--line);border-radius:100px;}\n  @media(max-width:1100px){.col{border:1px solid var(--line);border-radius:14px;}}\n  .ch{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}\n  .ch .c{font-family:var(--mono);}\n\n  /* integrity + stats */\n  .integ{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}\n  .integ .lab{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-2);margin-bottom:8px;}\n  .integ .lab b{font-family:var(--mono);color:var(--text);}\n  .ibar{height:9px;border-radius:100px;background:var(--panel-2);overflow:hidden;} .ibar i{display:block;height:100%;border-radius:100px;background:linear-gradient(90deg,var(--safe),var(--cyan));transition:width .4s,background .4s;}\n  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}\n  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}\n  .stat .v{font-family:var(--mono);font-size:1.2rem;font-weight:600;} .stat .l{font-size:.62rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}\n\n  /* defenders */\n  .def{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;transition:border-color .3s,box-shadow .3s;position:relative;overflow:hidden;}\n  .def.engaging{border-color:rgba(34,211,238,.35);}\n  .def.rogue{border-color:var(--rogue);box-shadow:0 0 24px rgba(251,113,133,.2);animation:rg 1.2s infinite;}\n  @keyframes rg{50%{box-shadow:0 0 34px rgba(251,113,133,.32);}}\n  .def.quarantined{opacity:.5;}\n  .def .dt{display:flex;align-items:center;gap:9px;margin-bottom:8px;}\n  .def .av{width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--cyan);flex:none;}\n  .def.rogue .av{color:var(--rogue);border-color:var(--rogue);}\n  .def .av svg{width:16px;height:16px;}\n  .def b{font-weight:600;font-size:.92rem;} .def .dstat{font-size:.72rem;color:var(--text-2);}\n  .def .dstat.rogue{color:var(--rogue);font-weight:600;}\n  .def .dstate{margin-left:auto;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:100px;background:var(--panel-2);color:var(--text-3);}\n  .def.engaging .dstate{background:var(--cyan-soft);color:var(--cyan);} .def.rogue .dstate{background:var(--rogue-soft);color:var(--rogue);}\n  .def .tb{height:4px;border-radius:100px;background:var(--panel-2);margin-top:10px;overflow:hidden;} .def .tb i{display:block;height:100%;background:var(--safe);border-radius:100px;transition:width .3s,background .3s;}\n  .def.rogue .tb i{background:var(--rogue);}\n\n  /* threats */\n  .empty{color:var(--text-3);text-align:center;padding:50px 10px;font-size:.86rem;}\n  .empty svg{width:28px;height:28px;display:block;margin:0 auto 12px;opacity:.5;}\n  .threat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden;animation:tin .3s ease;}\n  @keyframes tin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}\n  .threat.blocked{opacity:.72;border-style:dashed;}\n  .threat .tt{display:flex;align-items:center;gap:10px;margin-bottom:4px;}\n  .threat .dot{width:8px;height:8px;border-radius:50%;background:var(--threat);flex:none;box-shadow:0 0 10px var(--threat);}\n  .threat.blocked .dot{background:var(--warn);box-shadow:none;}\n  .threat .actor{font-weight:600;font-size:1rem;}\n  .threat .attr{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--text-3);}\n  .threat .tactic{font-size:.8rem;color:var(--text-2);margin-bottom:12px;}\n  .stages{display:flex;gap:6px;margin-bottom:10px;}\n  .stg{flex:1;text-align:center;font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:5px 0;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-2);}\n  .stg.active{color:var(--threat);border-color:rgba(244,63,94,.4);background:var(--threat-soft);}\n  .stg.done{color:var(--text-2);}\n  .tprog{height:6px;border-radius:100px;background:var(--panel-2);overflow:hidden;margin-bottom:12px;} .tprog i{display:block;height:100%;border-radius:100px;background:var(--threat);transition:width .4s;}\n  .threat.blocked .tprog i{background:var(--warn);}\n  .th-actions{display:flex;gap:8px;align-items:center;}\n  .tbtn{border-radius:9px;padding:8px 15px;font-size:.8rem;font-weight:600;border:1.5px solid transparent;}\n  .tbtn.block{background:var(--panel-2);border-color:var(--line);color:var(--text);}\n  .tbtn.contain{background:var(--threat);color:#fff;}\n  .tbtn.eng{margin-left:auto;font-size:.7rem;color:var(--cyan);font-family:var(--mono);}\n  .rebuild{margin-left:auto;font-family:var(--mono);font-size:.74rem;color:var(--warn);}\n\n  /* rogue alert */\n  .ralert{background:linear-gradient(180deg,var(--rogue-soft),rgba(251,113,133,.03));border:1px solid var(--rogue);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 0 30px rgba(251,113,133,.16);animation:tin .3s ease;}\n  .ralert .rh{display:flex;align-items:center;gap:8px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rogue);font-weight:700;margin-bottom:8px;}\n  .ralert p{margin:0 0 12px;font-size:.9rem;} .ralert p b{color:var(--rogue);}\n  .ralert .btn.go{background:var(--rogue);color:#fff;box-shadow:0 0 18px rgba(251,113,133,.3);}\n\n  /* activity feed */\n  .feed{font-family:var(--mono);font-size:.76rem;line-height:1.7;}\n  .fl{display:flex;gap:8px;padding:2px 0;animation:fin .25s ease;}\n  @keyframes fin{from{opacity:0;transform:translateX(-5px);}to{opacity:1;}}\n  .fl .ts{color:var(--text-3);flex:none;}\n  .fl .tx{color:var(--text-2);}\n  .fl.threat .tx{color:#fca5b5;} .fl.safe .tx{color:#6ee7b7;} .fl.warn .tx{color:#fcd34d;} .fl.rogue .tx{color:var(--rogue);font-weight:600;} .fl.you .tx{color:#7dd3fc;font-weight:600;} .fl.crit .tx{color:#fff;font-weight:600;}\n\n  /* gate */\n  .gateov{position:fixed;inset:0;background:rgba(4,5,10,.6);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s;}\n  .gateov.open{opacity:1;pointer-events:auto;}\n  .gatec{background:var(--panel);border:1px solid rgba(245,158,11,.4);border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(245,158,11,.12);transform:scale(.97);transition:transform .25s;}\n  .gateov.open .gatec{transform:none;}\n  .gatec .gh{display:flex;align-items:center;gap:8px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:700;margin-bottom:10px;}\n  .gatec h3{margin:0 0 8px;font-size:1.25rem;} .gatec p{margin:0 0 18px;color:var(--text-2);font-size:.9rem;line-height:1.55;}\n  .gatec .ga{display:flex;gap:10px;} .gatec .ga .btn.go{flex:none;}\n\n  /* end */\n  .endov{position:fixed;inset:0;background:rgba(4,5,10,.7);backdrop-filter:blur(8px);z-index:210;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s;}\n  .endov.open{opacity:1;pointer-events:auto;}\n  .endc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;max-width:460px;width:100%;text-align:center;transform:translateY(12px);transition:transform .3s;}\n  .endov.open .endc{transform:none;}\n  .endc .eic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}\n  .endc.held .eic{background:var(--safe-soft);color:var(--safe);} .endc.breached .eic{background:var(--threat-soft);color:var(--threat);}\n  .endc .eic svg{width:32px;height:32px;}\n  .endc h2{margin:0 0 6px;font-size:1.7rem;} .endc.held h2{color:var(--safe);} .endc.breached h2{color:var(--threat);}\n  .endc .esub{color:var(--text-2);margin:0 0 22px;}\n  .esum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;text-align:left;}\n  .esum .s{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}\n  .esum .s .v{font-family:var(--mono);font-size:1.3rem;font-weight:600;} .esum .s .l{font-size:.66rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}\n\n  .footnote{position:relative;z-index:2;text-align:center;font-size:.72rem;color:var(--text-3);padding:9px;border-top:1px solid var(--line);}\n  .pswitch{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:100px;padding:3px;margin-left:8px;}\n  .pswitch a{font-size:.74rem;font-weight:600;color:var(--text-2);padding:5px 12px;border-radius:100px;text-decoration:none;}\n  .pswitch a.on{background:var(--cyan);color:#04121a;} .pswitch a:hover{color:var(--text);}\n</style>\n</head>\n<body>\n\n<div class=\"top\">\n  <div class=\"logo\"><span class=\"mk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5z\"/></svg></span> Bastion <small>autonomous defense console</small></div>\n  <div class=\"pswitch\"><a href=\"aevia.html\">Aevia</a><a href=\"helm.html\">Helm</a><a class=\"on\" href=\"bastion.html\">Bastion</a></div>\n  <div class=\"thlevel stable\" id=\"thLevel\"><span class=\"d\"></span><span id=\"thLevelT\">Stable</span></div>\n  <div class=\"miss\" style=\"margin-left:8px;\"><span class=\"l\">Hold the perimeter</span><span class=\"v\" id=\"mTime\">1:15</span></div>\n  <div class=\"top-right\">\n    <button class=\"btn ghost hidden\" id=\"pauseBtn\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/></svg> Pause</button>\n    <button class=\"btn go\" id=\"startBtn\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg> Start defense</button>\n  </div>\n</div>\n\n<div class=\"grid\">\n  <!-- LEFT: integrity, stats, defenders -->\n  <div class=\"col\">\n    <div class=\"integ\">\n      <div class=\"lab\"><span>Perimeter integrity</span><b id=\"integV\">100%</b></div>\n      <div class=\"ibar\"><i id=\"integBar\" style=\"width:100%\"></i></div>\n    </div>\n    <div class=\"stats\">\n      <div class=\"stat\"><div class=\"v\" id=\"sContained\">0</div><div class=\"l\">Contained</div></div>\n      <div class=\"stat\"><div class=\"v\" id=\"sBreaches\">0</div><div class=\"l\">Breaches</div></div>\n      <div class=\"stat\"><div class=\"v\" id=\"sActive\">0</div><div class=\"l\">Active threats</div></div>\n      <div class=\"stat\"><div class=\"v\" id=\"sFleet\">4</div><div class=\"l\">Defenders up</div></div>\n    </div>\n    <div class=\"ch\">Defender fleet</div>\n    <div id=\"defenders\"></div>\n  </div>\n\n  <!-- CENTER: threats -->\n  <div class=\"col\">\n    <div id=\"rogueWrap\"></div>\n    <div class=\"ch\">Incoming threats <span class=\"c\" id=\"thCount\">0</span></div>\n    <div id=\"threats\"><div class=\"empty\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5z\"/></svg>Press Start defense. Attacker agents will begin probing your perimeter, and your fleet will engage automatically.</div></div>\n  </div>\n\n  <!-- RIGHT: feed -->\n  <div class=\"col\">\n    <div class=\"ch\">Activity <span class=\"c\">live</span></div>\n    <div class=\"feed\" id=\"feed\"></div>\n  </div>\n</div>\n\n<div class=\"footnote\">Bastion is a concept by Sai Keerthi Koppolu, exploring how a person stays in control when AI agents fight AI agents, and one of your own can turn. Fictional actors and events.</div>\n\n<div class=\"gateov\" id=\"gateov\"><div class=\"gatec\" id=\"gatec\"></div></div>\n<div class=\"endov\" id=\"endov\"><div class=\"endc\" id=\"endc\"></div></div>\n\n<script>\n(function(){\n  function $(id){return document.getElementById(id);}\n  var ACTORS=['Nightjar','Rustwind','Pale Fox','Cinder','Vesper','Graywater','Halcyon','Ashen','Dryland'];\n  var TACTICS=['credential phishing','SQL injection','exposed edge device','session hijack','supply-chain implant','prompt injection','unpatched service'];\n  var STAGES=['Recon','Exploit','Exfiltrate'];\n  var DEF_ICON='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5z\"/></svg>';\n\n  var S={};\n  function reset(){\n    S={running:false,paused:false,over:false,gate:null,time:75,tick:0,integ:100,contained:0,breaches:0,\n      threats:[],idc:0,rogueId:null,rogueCaught:null,\n      defenders:[{id:'d0',name:'Sentry',status:'patrol',trust:100,target:null},{id:'d1',name:'Warden',status:'patrol',trust:100,target:null},{id:'d2',name:'Aegis',status:'patrol',trust:100,target:null},{id:'d3',name:'Bulwark',status:'patrol',trust:100,target:null}]};\n  }\n  reset();\n\n  function fmt(t){ t=Math.max(0,Math.round(t)); return Math.floor(t/60)+':'+(t%60<10?'0':'')+(t%60); }\n  function log(cls,m){ var f=$('feed'); var d=document.createElement('div'); d.className='fl '+cls; d.innerHTML='<span class=\"ts\">'+fmt(75-S.time)+'</span><span class=\"tx\">'+m+'</span>'; f.appendChild(d); f.scrollTop=f.scrollHeight; }\n  function rand(a){ return a[Math.floor(Math.random()*a.length)]; }\n\n  function spawnThreat(){\n    if(S.threats.filter(function(t){return t.status!=='dead';}).length>=6) return;\n    S.threats.push({id:'t'+(++S.idc),actor:rand(ACTORS),tactic:rand(TACTICS),stage:0,prog:0,status:'active',rebuild:0,trust:55+Math.floor(Math.random()*42),variant:1,engagedBy:null});\n    log('threat', S.threats[S.threats.length-1].actor+' began probing the perimeter');\n  }\n\n  function assign(){\n    // drop dead targets\n    S.defenders.forEach(function(d){ if(d.status==='engaging'){ var t=S.threats.filter(function(x){return x.id===d.target;})[0]; if(!t||t.status!=='active'){ d.status='patrol'; d.target=null; } } });\n    S.threats.forEach(function(t){ t.engagedBy=null; });\n    S.defenders.forEach(function(d){ if(d.status==='engaging'&&d.target){ var t=S.threats.filter(function(x){return x.id===d.target;})[0]; if(t)t.engagedBy=d.id; } });\n    var free=S.defenders.filter(function(d){ return d.status==='patrol'; });\n    var un=S.threats.filter(function(t){ return t.status==='active'&&!t.engagedBy; }).sort(function(a,b){ return (b.stage-a.stage)||(b.prog-a.prog); });\n    free.forEach(function(d){ var t=un.shift(); if(t){ d.status='engaging'; d.target=t.id; t.engagedBy=d.id; } });\n  }\n\n  function step(){\n    S.tick++; S.time--;\n    // spawn\n    var p=Math.min(.7,.28+S.tick*.012); if(Math.random()<p) spawnThreat();\n    if(S.tick===2) spawnThreat();\n    assign();\n    // advance threats\n    S.threats.forEach(function(t){\n      if(t.status==='blocked'){ t.rebuild--; if(t.rebuild<=0){ t.status='active'; t.variant++; t.prog=25; t.trust=55+Math.floor(Math.random()*42); log('warn', t.actor+' rebuilt a new variant and resumed'); } return; }\n      if(t.status!=='active') return;\n      var base=9+t.stage*4; var def=t.engagedBy?1:0; var net=base-def*17;\n      t.prog+=net;\n      if(t.prog<=0){ if(t.stage===0){ t.status='dead'; S.contained++; log('safe', (t.engagedBy?defName(t.engagedBy)+' repelled ':'Repelled ')+t.actor); } else { t.prog=0; } return; }\n      if(t.prog>=100){ t.stage++; t.prog=0; if(t.stage>2){ t.status='dead'; S.breaches++; S.integ=Math.max(0,S.integ-15); log('crit','BREACH \u00b7 '+t.actor+' exfiltrated data'); } else { log('threat', t.actor+' advanced to '+STAGES[t.stage]); } }\n    });\n    S.threats=S.threats.filter(function(t){ return t.status!=='dead'; });\n    // rogue trigger (random)\n    if(!S.rogueId && S.rogueCaught===null && S.tick>6 && Math.random()<Math.min(.14,.03+S.tick*.006)){\n      var cand=S.defenders.filter(function(d){ return d.status==='patrol'||d.status==='engaging'; });\n      if(cand.length){ var r=rand(cand); r.status='rogue'; r.prevTrust=r.trust; r.trust=18; S.rogueId=r.id; r.target=null; log('rogue','INSIDER \u00b7 '+r.name+' is behaving abnormally'); }\n    }\n    // rogue damage\n    if(S.rogueId){ S.integ=Math.max(0,S.integ-3); if(S.tick%3===0){ var rd=S.defenders.filter(function(d){return d.id===S.rogueId;})[0]; if(rd) log('rogue', rd.name+' is quietly moving data it should not touch'); } }\n    // end checks\n    if(S.integ<=0){ end('breached'); return; }\n    if(S.time<=0){ end('held'); return; }\n    render();\n  }\n  function defName(id){ var d=S.defenders.filter(function(x){return x.id===id;})[0]; return d?d.name:'A defender'; }\n\n  // ---- actions ----\n  function block(id){ var t=S.threats.filter(function(x){return x.id===id;})[0]; if(!t||t.status!=='active')return; t.status='blocked'; t.rebuild=6; t.engagedBy=null; S.defenders.forEach(function(d){ if(d.target===id){d.status='patrol';d.target=null;} }); log('warn','You blocked '+t.actor+'. It will try to rebuild.'); render(); }\n  function contain(id){ var t=S.threats.filter(function(x){return x.id===id;})[0]; if(!t)return;\n    if(t.trust<70){ openGate('Contain '+t.actor+'?','Attribution is only '+t.trust+'%. Containing now may disrupt a legitimate service. Your call.', function(){ doContain(id); }); }\n    else doContain(id);\n  }\n  function doContain(id){ var t=S.threats.filter(function(x){return x.id===id;})[0]; if(!t)return; t.status='dead'; S.contained++; S.defenders.forEach(function(d){ if(d.target===id){d.status='patrol';d.target=null;} }); S.threats=S.threats.filter(function(x){return x.status!=='dead';}); log('you','You contained '+t.actor+' for good'); render(); }\n  function quarantine(defId){ var d=S.defenders.filter(function(x){return x.id===defId;})[0]; if(!d)return;\n    openGate('Quarantine '+d.name+'?','This removes one of your own defenders from the fight, but it stops the insider threat before it does more damage.', function(){\n      d.status='quarantined'; d.target=null; if(S.rogueId===defId){ S.rogueId=null; S.rogueCaught=true; } log('you','You quarantined '+d.name+'. Insider threat contained.'); render();\n    });\n  }\n\n  function openGate(title,detail,onOk){ S.gate={onOk:onOk}; S.paused=true;\n    $('gatec').innerHTML='<div class=\"gh\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 3l9 16H3z\"/><path d=\"M12 10v4M12 17h.01\"/></svg> Needs your approval</div><h3>'+title+'</h3><p>'+detail+'</p><div class=\"ga\"><button class=\"btn go\" data-g=\"ok\">Approve</button><button class=\"btn ghost\" data-g=\"no\">Cancel</button></div>';\n    $('gateov').classList.add('open');\n  }\n  function closeGate(ok){ var g=S.gate; S.gate=null; $('gateov').classList.remove('open'); if(ok&&g&&g.onOk)g.onOk(); S.paused=false; }\n\n  // ---- render ----\n  function render(){\n    $('mTime').textContent=fmt(S.time);\n    $('integV').textContent=Math.round(S.integ)+'%'; var ib=$('integBar'); ib.style.width=S.integ+'%'; ib.style.background=S.integ>50?'linear-gradient(90deg,var(--safe),var(--cyan))':(S.integ>25?'linear-gradient(90deg,var(--warn),var(--warn))':'linear-gradient(90deg,var(--threat),var(--threat))');\n    $('sContained').textContent=S.contained; $('sBreaches').textContent=S.breaches;\n    var act=S.threats.filter(function(t){return t.status==='active';}).length; $('sActive').textContent=act; $('thCount').textContent=S.threats.length;\n    $('sFleet').textContent=S.defenders.filter(function(d){return d.status!=='quarantined';}).length;\n    // threat level\n    var lv=$('thLevel'), lt=$('thLevelT'); lv.className='thlevel';\n    if(S.rogueId){ lv.classList.add('insider'); lt.textContent='Insider'; }\n    else if(S.integ<=34||act>=4){ lv.classList.add('critical'); lt.textContent='Critical'; }\n    else if(S.integ<=66||act>=2){ lv.classList.add('elevated'); lt.textContent='Elevated'; }\n    else { lv.classList.add('stable'); lt.textContent='Stable'; }\n    // defenders\n    $('defenders').innerHTML=S.defenders.map(function(d){\n      var st=d.status; var stateLbl={patrol:'Patrol',engaging:'Engaging',rogue:'Compromised',quarantined:'Quarantined'}[st];\n      var line = st==='rogue'?'<span class=\"dstat rogue\">Behaving abnormally</span>':st==='quarantined'?'<span class=\"dstat\">Isolated</span>':st==='engaging'?'<span class=\"dstat\">Engaging '+((S.threats.filter(function(x){return x.id===d.target;})[0]||{}).actor||'a threat')+'</span>':'<span class=\"dstat\">Watching the perimeter</span>';\n      return '<div class=\"def '+st+'\"><div class=\"dt\"><div class=\"av\">'+DEF_ICON+'</div><div><b>'+d.name+'</b>'+line+'</div><span class=\"dstate\">'+stateLbl+'</span></div><div class=\"tb\"><i style=\"width:'+d.trust+'%\"></i></div></div>';\n    }).join('');\n    // rogue alert\n    if(S.rogueId){ var rd=S.defenders.filter(function(x){return x.id===S.rogueId;})[0];\n      $('rogueWrap').innerHTML='<div class=\"ralert\"><div class=\"rh\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 3l9 16H3z\"/><path d=\"M12 10v4M12 17h.01\"/></svg> Insider alert</div><p><b>'+rd.name+'</b> has turned. It is reaching systems it should not and moving data. Every second it stays connected costs you integrity.</p><button class=\"btn go\" data-q=\"'+rd.id+'\">Quarantine '+rd.name+'</button></div>';\n    } else $('rogueWrap').innerHTML='';\n    // threats\n    var tv=$('threats');\n    if(!S.threats.length && S.running){ tv.innerHTML='<div class=\"empty\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M20 6 9 17l-5-5\"/></svg>Perimeter clear for now. Stay ready.</div>'; return; }\n    if(!S.running) return;\n    tv.innerHTML=S.threats.map(function(t){\n      var stages=STAGES.map(function(sname,i){ var c=i<t.stage?'done':(i===t.stage?'active':''); return '<span class=\"stg '+c+'\">'+sname+'</span>'; }).join('');\n      var actions = t.status==='blocked'\n        ? '<span class=\"rebuild\">rebuilding in '+t.rebuild+'s</span>'\n        : '<button class=\"tbtn block\" data-b=\"'+t.id+'\">Block</button><button class=\"tbtn contain\" data-c=\"'+t.id+'\">Contain</button>'+(t.engagedBy?'<span class=\"tbtn eng\">'+defName(t.engagedBy)+' engaging</span>':'');\n      return '<div class=\"threat '+(t.status==='blocked'?'blocked':'')+'\"><div class=\"tt\"><span class=\"dot\"></span><span class=\"actor\">'+t.actor+(t.variant>1?' v'+t.variant:'')+'</span><span class=\"attr\">attribution '+t.trust+'%</span></div><div class=\"tactic\">'+t.tactic+' &middot; '+STAGES[t.stage]+'</div><div class=\"stages\">'+stages+'</div><div class=\"tprog\"><i style=\"width:'+t.prog+'%\"></i></div><div class=\"th-actions\">'+actions+'</div></div>';\n    }).join('');\n  }\n\n  function end(kind){\n    S.running=false; S.over=true; if(S.timer){clearInterval(S.timer);S.timer=null;}\n    $('pauseBtn').classList.add('hidden'); $('startBtn').classList.remove('hidden');\n    $('startBtn').innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z\"/></svg> Run again';\n    var held=kind==='held';\n    var rogueLine = S.rogueCaught===true?'Insider caught':(S.rogueId?'Insider still active':'No insider this run');\n    $('endc').className='endc '+kind;\n    $('endc').innerHTML='<div class=\"eic\">'+(held?'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5z\"/><path d=\"M9 12l2 2 4-4\"/></svg>':'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5z\"/><path d=\"M9 9l6 6M15 9l-6 6\"/></svg>')+'</div>'\n      +'<h2>'+(held?'Perimeter held':'Perimeter breached')+'</h2>'\n      +'<p class=\"esub\">'+(held?'You kept integrity above zero for the full window. The line held.':'Integrity hit zero. The attackers, or the one inside, got through.')+'</p>'\n      +'<div class=\"esum\"><div class=\"s\"><div class=\"v\">'+S.contained+'</div><div class=\"l\">Threats contained</div></div><div class=\"s\"><div class=\"v\">'+S.breaches+'</div><div class=\"l\">Breaches</div></div><div class=\"s\"><div class=\"v\">'+Math.round(S.integ)+'%</div><div class=\"l\">Final integrity</div></div><div class=\"s\"><div class=\"v\" style=\"font-size:.95rem\">'+rogueLine+'</div><div class=\"l\">Insider</div></div></div>'\n      +'<button class=\"btn go\" data-again=\"1\" style=\"width:100%;justify-content:center\">Run again</button>';\n    $('endov').classList.add('open');\n  }\n\n  function start(){\n    $('endov').classList.remove('open'); reset(); S.running=true; render();\n    $('threats').innerHTML='<div class=\"empty\">Perimeter quiet. Watching...</div>'; $('feed').innerHTML='';\n    log('you','Defense started. Fleet on patrol.');\n    $('startBtn').classList.add('hidden'); $('pauseBtn').classList.remove('hidden');\n    if(S.timer)clearInterval(S.timer);\n    S.timer=setInterval(function(){ if(S.running&&!S.paused&&!S.over) step(); },1000);\n  }\n\n  // delegation\n  document.addEventListener('click',function(e){\n    var el=e.target.closest('[data-b],[data-c],[data-q],[data-g],[data-again]'); if(!el)return;\n    if(el.hasAttribute('data-b')) block(el.getAttribute('data-b'));\n    else if(el.hasAttribute('data-c')) contain(el.getAttribute('data-c'));\n    else if(el.hasAttribute('data-q')) quarantine(el.getAttribute('data-q'));\n    else if(el.hasAttribute('data-g')) closeGate(el.getAttribute('data-g')==='ok');\n    else if(el.hasAttribute('data-again')) start();\n  });\n  $('startBtn').addEventListener('click',function(){ if(!S.running) start(); });\n  $('pauseBtn').addEventListener('click',function(){ if(S.gate)return; S.paused=!S.paused; this.innerHTML=S.paused?'<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/></svg> Resume':'<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/></svg> Pause'; log('you',S.paused?'Paused.':'Resumed.'); });\n  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&S.gate) closeGate(false); });\n})();\n<\/script>\n<script>(function(){document.addEventListener(\"click\",function(e){var a=e.target.closest?e.target.closest('a[href$=\"aevia.html\"],a[href$=\"helm.html\"],a[href$=\"bastion.html\"]'):null;if(a){e.preventDefault();var h=a.getAttribute(\"href\");var k=h.indexOf(\"helm\")>-1?\"helm\":(h.indexOf(\"bastion\")>-1?\"bastion\":\"aevia\");parent.postMessage({nav:k},\"*\");}});})();<\/script>\n</body>\n</html>\n"};
['aevia','helm','bastion'].forEach(function(k){ document.getElementById('f-'+k).srcdoc=APPS[k]; });
function show(k){ ['aevia','helm','bastion'].forEach(function(x){ document.getElementById('f-'+x).classList.toggle('on',x===k); }); }
window.addEventListener('message',function(e){ if(e.data&&e.data.nav){ show(e.data.nav); } });
